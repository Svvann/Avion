<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Petit Avion</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1a2e; overflow: hidden; font-family: Arial, sans-serif; }
  canvas { display: block; margin: 0 auto; background: #3d4f30; }
</style>
</head>
<body>
<canvas id="jeu" width="480" height="720"></canvas>
<script>
const canvas = document.getElementById('jeu');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Adapte la taille à la fenêtre en gardant le ratio
function redimensionner() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
window.addEventListener('resize', redimensionner);
redimensionner();

const touches = {};
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  touches[e.key] = true;
  if (e.key === 'Enter' && etat !== 'jeu') demarrer();
});
window.addEventListener('keyup', e => { touches[e.key] = false; });

const alea = (a, b) => a + Math.random() * (b - a);
const choisir = liste => liste[Math.floor(Math.random() * liste.length)];

let etat = 'menu';
let avion, balles, ennemis, explosions, fumees, score, vies, delaiTir, delaiEnnemi, invincible, temps = 0;

// =====================================================================
//  FOND : vraies photos aériennes IGN (Géoplateforme), lieu au hasard
// =====================================================================
const ZOOM = 16, TUILE = 256;
const sol = { cache: new Map(), x: 0, y: 0, vitesse: 1.2, chargees: 0, erreurs: 0 };

function lonLatVersPixel(lon, lat) {
  const n = Math.pow(2, ZOOM) * TUILE;
  const r = lat * Math.PI / 180;
  return [(lon + 180) / 360 * n, (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n];
}

function choisirLieu() {
  // zone rurale au centre-est de la France, différente à chaque partie
  const [x, y] = lonLatVersPixel(alea(0.5, 6.0), alea(45.5, 48.3));
  sol.x = Math.round(x - W / 2);
  sol.y = Math.round(y - H / 2);
  sol.cache.clear();
}

function imageTuile(col, ligne) {
  const cle = col + ',' + ligne;
  let t = sol.cache.get(cle);
  if (!t) {
    t = { img: new Image(), ok: false, ligne };
    t.img.onload = () => { t.ok = true; sol.chargees++; };
    t.img.onerror = () => { sol.erreurs++; };
    t.img.src = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0' +
      '&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg' +
      `&TILEMATRIX=${ZOOM}&TILEROW=${ligne}&TILECOL=${col}`;
    sol.cache.set(cle, t);
  }
  return t;
}

// Pas d'internet ? on bascule sur le décor généré
const horsLigne = () => sol.erreurs > 4 && sol.chargees === 0;

function avancerSol() {
  sol.y -= sol.vitesse;
  if (horsLigne()) return;
  const c0 = Math.floor(sol.x / TUILE), c1 = Math.floor((sol.x + W) / TUILE);
  const l0 = Math.floor(sol.y / TUILE), l1 = Math.floor((sol.y + H) / TUILE);
  // précharge 3 rangées d'avance, oublie celles déjà passées
  for (let l = l0 - 3; l <= l1; l++) for (let c = c0; c <= c1; c++) imageTuile(c, l);
  for (const [cle, t] of sol.cache) if (t.ligne > l1 + 1) sol.cache.delete(cle);
}

function dessinerSol() {
  if (horsLigne()) { dessinerFondGenere(); return; }
  const ox = Math.round(sol.x), oy = Math.round(sol.y);
  const c0 = Math.floor(ox / TUILE), c1 = Math.floor((ox + W) / TUILE);
  const l0 = Math.floor(oy / TUILE), l1 = Math.floor((oy + H) / TUILE);
  for (let l = l0; l <= l1; l++) {
    for (let c = c0; c <= c1; c++) {
      const t = imageTuile(c, l);
      const x = c * TUILE - ox, y = l * TUILE - oy;
      if (t.ok) ctx.drawImage(t.img, x, y);
      else { ctx.fillStyle = '#4a5a3a'; ctx.fillRect(x, y, TUILE, TUILE); }
    }
  }
  // légère brume d'altitude
  ctx.fillStyle = 'rgba(200,215,230,0.08)';
  ctx.fillRect(0, 0, W, H);
}

// ---------- Décor généré (secours hors ligne) ----------
function aire(poly) {
  let s = 0;
  for (let i = 0; i < poly.length; i++) {
    const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length];
    s += x1 * y2 - x2 * y1;
  }
  return Math.abs(s) / 2;
}
function centre(poly) {
  let x = 0, y = 0;
  poly.forEach(p => { x += p[0]; y += p[1]; });
  return [x / poly.length, y / poly.length];
}
function couper(poly, p, d) {
  const cote = v => d[0] * (v[1] - p[1]) - d[1] * (v[0] - p[0]);
  const a = [], b = [];
  for (let i = 0; i < poly.length; i++) {
    const v1 = poly[i], v2 = poly[(i + 1) % poly.length];
    const s1 = cote(v1), s2 = cote(v2);
    (s1 >= 0 ? a : b).push(v1);
    if ((s1 >= 0) !== (s2 >= 0)) {
      const t = s1 / (s1 - s2);
      const inter = [v1[0] + (v2[0] - v1[0]) * t, v1[1] + (v2[1] - v1[1]) * t];
      a.push(inter); b.push(inter);
    }
  }
  return [a, b];
}
function chemin(g, poly) {
  g.beginPath();
  poly.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
  g.closePath();
}
const couleursChamps = ['#3a4630', '#34402c', '#5c7a3c', '#6f8b47', '#86984f', '#c2b48a', '#b5a679', '#9a8f5a', '#a9a27a'];
function remplirParcelle(g, poly) {
  const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const [cx, cy] = centre(poly);
  const diag = Math.hypot(x1 - x0, y1 - y0);
  const surface = aire(poly);
  g.save();
  chemin(g, poly);
  g.clip();
  if (Math.random() < 0.22) {
    g.fillStyle = '#2b3f24';
    g.fill();
    for (let i = 0; i < surface / 40; i++) {
      g.fillStyle = choisir(['#22351d', '#2f4a28', '#3a5730', '#283f22']);
      g.beginPath(); g.arc(alea(x0, x1), alea(y0, y1), alea(3, 7), 0, Math.PI * 2); g.fill();
    }
  } else {
    g.fillStyle = choisir(couleursChamps);
    g.fill();
    for (let i = 0; i < surface / 120; i++) {
      g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.05)';
      g.fillRect(alea(x0, x1), alea(y0, y1), alea(2, 6), alea(2, 6));
    }
    if (Math.random() < 0.6) {
      const ang = alea(0, Math.PI);
      const d = [Math.cos(ang), Math.sin(ang)], n = [-d[1], d[0]];
      const ecart = alea(14, 28);
      g.strokeStyle = 'rgba(255,255,255,0.2)';
      g.lineWidth = 1.2;
      for (let k = -diag; k < diag; k += ecart) {
        g.beginPath();
        g.moveTo(cx + n[0] * k - d[0] * diag, cy + n[1] * k - d[1] * diag);
        g.lineTo(cx + n[0] * k + d[0] * diag, cy + n[1] * k + d[1] * diag);
        g.stroke();
      }
    }
  }
  g.restore();
  g.strokeStyle = 'rgba(35,50,28,0.85)';
  g.lineWidth = 2;
  chemin(g, poly);
  g.stroke();
}
function genererTuile() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#3d4f30';
  g.fillRect(0, 0, W, H);
  const a0 = alea(0, Math.PI);
  const axes = [[Math.cos(a0), Math.sin(a0)], [-Math.sin(a0), Math.cos(a0)]];
  const parcelles = [];
  (function decouper(poly, prof) {
    if (prof > 8 || aire(poly) < alea(7000, 22000)) { parcelles.push(poly); return; }
    const etendues = axes.map(n => {
      const proj = poly.map(v => v[0] * n[0] + v[1] * n[1]);
      return [Math.min(...proj), Math.max(...proj)];
    });
    const i = (etendues[0][1] - etendues[0][0]) > (etendues[1][1] - etendues[1][0]) ? 0 : 1;
    const ang = Math.atan2(axes[i][1], axes[i][0]) + alea(-0.25, 0.25);
    const n = [Math.cos(ang), Math.sin(ang)];
    const [mn, mx] = etendues[i];
    const pos = mn + (mx - mn) * alea(0.35, 0.65);
    const [cx, cy] = centre(poly);
    const decal = pos - (cx * axes[i][0] + cy * axes[i][1]);
    const p = [cx + axes[i][0] * decal, cy + axes[i][1] * decal];
    const [a, b] = couper(poly, p, [-n[1], n[0]]);
    if (a.length < 3 || b.length < 3 || aire(a) < 3000 || aire(b) < 3000) { parcelles.push(poly); return; }
    decouper(a, prof + 1);
    decouper(b, prof + 1);
  })([[0, 0], [W, 0], [W, H], [0, H]], 0);
  parcelles.forEach(p => remplirParcelle(g, p));
  return c;
}
let tuilesGenerees = null;
function dessinerFondGenere() {
  if (!tuilesGenerees) tuilesGenerees = [{ img: genererTuile(), y: 0 }, { img: genererTuile(), y: -H }];
  tuilesGenerees.forEach(t => {
    t.y += sol.vitesse;
    if (t.y >= H) { t.y -= 2 * H; t.img = genererTuile(); }
    ctx.drawImage(t.img, 0, Math.round(t.y));
  });
}

// =====================================================================
//  AVIONS : sprites détaillés pré-dessinés (vue de dessus, nez en haut)
// =====================================================================
const ECHELLE = 2; // dessin en haute définition puis réduit

function dessinerCellule(g, p) {
  // --- ailes (forme elliptique effilée)
  const aile = cote => {
    g.beginPath();
    g.moveTo(cote * 5, -8);
    g.bezierCurveTo(cote * 20, -9, cote * 36, -6, cote * 41, -1);
    g.quadraticCurveTo(cote * 43, 3, cote * 39, 5);
    g.bezierCurveTo(cote * 30, 7, cote * 16, 9, cote * 5, 10);
    g.closePath();
  };
  [-1, 1].forEach(cote => {
    aile(cote);
    const gr = g.createLinearGradient(0, -9, 0, 10);
    gr.addColorStop(0, p.clair); gr.addColorStop(0.5, p.base); gr.addColorStop(1, p.sombre);
    g.fillStyle = gr; g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 0.6; g.stroke();
    // panneaux, ailerons et volets
    g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 0.4;
    g.beginPath();
    g.moveTo(cote * 6, 6); g.lineTo(cote * 22, 5.5);
    g.moveTo(cote * 23, 5.5); g.lineTo(cote * 38, 3.5);
    g.moveTo(cote * 22, 9); g.lineTo(cote * 22, 4);
    g.moveTo(cote * 14, -8.5); g.lineTo(cote * 14, 9);
    g.moveTo(cote * 28, -7.5); g.lineTo(cote * 28, 7.5);
    g.stroke();
    // canons dans l'aile
    g.fillStyle = '#222';
    g.fillRect(cote * 17 - 0.6, -12, 1.2, 4);
    // marquage
    if (p.cocarde) {
      g.beginPath(); g.arc(cote * 30, 0, 4, 0, Math.PI * 2); g.fillStyle = p.cocarde[0]; g.fill();
      g.beginPath(); g.arc(cote * 30, 0, 2.6, 0, Math.PI * 2); g.fillStyle = p.cocarde[1]; g.fill();
      g.beginPath(); g.arc(cote * 30, 0, 1.3, 0, Math.PI * 2); g.fillStyle = p.cocarde[2]; g.fill();
    }
  });

  // --- empennage horizontal
  [-1, 1].forEach(cote => {
    g.beginPath();
    g.moveTo(cote * 2, 25);
    g.quadraticCurveTo(cote * 13, 24, cote * 15, 28);
    g.quadraticCurveTo(cote * 14, 32, cote * 2, 32);
    g.closePath();
    const gr = g.createLinearGradient(0, 24, 0, 32);
    gr.addColorStop(0, p.clair); gr.addColorStop(1, p.sombre);
    g.fillStyle = gr; g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 0.5; g.stroke();
  });

  // --- fuselage (ombrage cylindrique)
  g.beginPath();
  g.moveTo(0, -34);
  g.bezierCurveTo(5, -34, 6, -26, 6, -16);
  g.bezierCurveTo(6, 0, 4.5, 20, 1.6, 36);
  g.lineTo(-1.6, 36);
  g.bezierCurveTo(-4.5, 20, -6, 0, -6, -16);
  g.bezierCurveTo(-6, -26, -5, -34, 0, -34);
  g.closePath();
  const gf = g.createLinearGradient(-6, 0, 6, 0);
  gf.addColorStop(0, p.sombre); gf.addColorStop(0.35, p.clair); gf.addColorStop(0.55, p.base); gf.addColorStop(1, p.sombre);
  g.fillStyle = gf; g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 0.6; g.stroke();

  // capot moteur
  g.save(); g.clip();
  g.fillStyle = p.capot;
  g.fillRect(-7, -35, 14, 9);
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 0.4;
  g.beginPath(); g.moveTo(-7, -20); g.lineTo(7, -20); g.moveTo(-7, 14); g.lineTo(7, 14); g.stroke();
  // pots d'échappement
  g.fillStyle = 'rgba(30,30,30,0.6)';
  for (let i = 0; i < 3; i++) { g.fillRect(-6, -24 + i * 2.2, 1.6, 1.2); g.fillRect(4.4, -24 + i * 2.2, 1.6, 1.2); }
  g.restore();

  // dérive (vue de dessus : une fine arête)
  g.fillStyle = p.sombre;
  g.fillRect(-0.8, 22, 1.6, 14);

  // cockpit
  g.beginPath(); g.ellipse(0, -6, 3.2, 7, 0, 0, Math.PI * 2);
  const gc = g.createLinearGradient(-3, -12, 3, 0);
  gc.addColorStop(0, '#cfe8ff'); gc.addColorStop(0.4, '#4a6b88'); gc.addColorStop(1, '#16222e');
  g.fillStyle = gc; g.fill();
  g.strokeStyle = '#222'; g.lineWidth = 0.6; g.stroke();
  g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 0.4;
  g.beginPath(); g.moveTo(-3, -6); g.lineTo(3, -6); g.moveTo(-2.6, -1.5); g.lineTo(2.6, -1.5); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.7)';
  g.beginPath(); g.ellipse(-1, -9, 0.8, 2.4, 0.2, 0, Math.PI * 2); g.fill();

  // casserole d'hélice
  const gs = g.createRadialGradient(-0.8, -35.5, 0.3, 0, -34.5, 3);
  gs.addColorStop(0, '#fff'); gs.addColorStop(1, p.casserole);
  g.fillStyle = gs;
  g.beginPath(); g.ellipse(0, -35, 2.6, 3.4, 0, 0, Math.PI * 2); g.fill();
}

function creerSprite(palette) {
  const L = 100, Ht = 90;
  const c = document.createElement('canvas');
  c.width = L * ECHELLE; c.height = Ht * ECHELLE;
  const g = c.getContext('2d');
  g.scale(ECHELLE, ECHELLE);
  g.translate(L / 2, Ht / 2);
  dessinerCellule(g, palette);
  // ombre portée : même silhouette, noire et floue
  const o = document.createElement('canvas');
  o.width = c.width; o.height = c.height;
  const go = o.getContext('2d');
  go.filter = 'blur(3px)';
  go.drawImage(c, 0, 0);
  go.filter = 'none';
  go.globalCompositeOperation = 'source-in';
  go.fillStyle = 'rgba(0,0,0,0.45)';
  go.fillRect(0, 0, o.width, o.height);
  return { img: c, ombre: o, l: L, h: Ht };
}

const spriteJoueur = creerSprite({
  base: '#6b7650', clair: '#8f9a70', sombre: '#3f4730', capot: '#4a5236', casserole: '#c0392b',
  cocarde: ['#1f3a8a', '#f4f4f4', '#c0392b']
});
const spriteEnnemi = creerSprite({
  base: '#7d858c', clair: '#a7afb5', sombre: '#4a5056', capot: '#d4a017', casserole: '#d4a017',
  cocarde: null
});

function dessinerSprite(s, x, y, angle, roulis, altitude) {
  const l = s.l, h = s.h;
  // ombre sur le sol, décalée par le soleil
  ctx.save();
  ctx.translate(x + altitude * 0.6, y + altitude);
  ctx.rotate(angle);
  ctx.scale(0.75 * (1 - Math.abs(roulis) * 0.25), 0.75);
  ctx.drawImage(s.ombre, -l / 2, -h / 2, l, h);
  ctx.restore();
  // avion (le roulis rétrécit l'envergure)
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(1 - Math.abs(roulis) * 0.25, 1);
  ctx.drawImage(s.img, -l / 2, -h / 2, l, h);
  // hélice : disque flou + pale qui tourne
  ctx.fillStyle = 'rgba(220,220,220,0.18)';
  ctx.beginPath(); ctx.ellipse(0, -h / 2 + 8, 16, 2.2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(40,40,40,0.55)'; ctx.lineWidth = 1.6;
  const a = Math.cos(temps * 1.7) * 16;
  ctx.beginPath(); ctx.moveTo(-a, -h / 2 + 8); ctx.lineTo(a, -h / 2 + 8); ctx.stroke();
  // reflet lumineux qui suit l'inclinaison
  if (roulis) {
    ctx.fillStyle = `rgba(255,255,255,${Math.abs(roulis) * 0.12})`;
    ctx.fillRect(roulis > 0 ? -l / 2 : 0, -h / 2, l / 2, h);
  }
  ctx.restore();
}

// =====================================================================
//  Nuages réalistes (sprites flous) et effets
// =====================================================================
function creerNuage() {
  const L = 260, Ht = 180;
  const c = document.createElement('canvas');
  c.width = L; c.height = Ht;
  const g = c.getContext('2d');
  for (let i = 0; i < 26; i++) {
    const x = alea(60, L - 60), y = alea(50, Ht - 50), r = alea(18, 46);
    const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.55)');
    gr.addColorStop(0.6, 'rgba(240,244,250,0.3)');
    gr.addColorStop(1, 'rgba(220,228,240,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  return c;
}
const modelesNuages = Array.from({ length: 5 }, creerNuage);
const nuages = Array.from({ length: 4 }, () => nouveauNuage(alea(-200, H)));
function nouveauNuage(y) {
  return { img: choisir(modelesNuages), x: alea(-120, W - 140), y, v: alea(2.2, 3.2), e: alea(0.8, 1.5) };
}

function exploser(x, y, gros) {
  for (let i = 0; i < (gros ? 40 : 24); i++) {
    const ang = Math.random() * Math.PI * 2, v = alea(0.5, gros ? 5 : 3.5);
    explosions.push({ x, y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, vie: alea(18, 34), max: 34, r: alea(2, 5) });
  }
  for (let i = 0; i < 10; i++) {
    fumees.push({ x: x + alea(-8, 8), y: y + alea(-8, 8), vx: alea(-0.4, 0.4), vy: alea(-0.2, 0.6), r: alea(5, 10), vie: alea(50, 80), max: 80 });
  }
}

function touche(a, b, r) {
  return Math.hypot(a.x - b.x, a.y - b.y) < r;
}

function demarrer() {
  avion = { x: W / 2, y: H - 120, vitesse: 4.5, roulis: 0 };
  balles = []; ennemis = []; explosions = []; fumees = [];
  score = 0; vies = 3; delaiTir = 0; delaiEnnemi = 60; invincible = 0;
  choisirLieu();
  etat = 'jeu';
}

choisirLieu();

// =====================================================================
//  Boucle de jeu
// =====================================================================
function mettreAJour() {
  temps++;
  avancerSol();
  nuages.forEach((n, i) => { n.y += n.v; if (n.y > H + 20) nuages[i] = nouveauNuage(-200 * n.e); });
  fumees && fumees.forEach(f => { f.x += f.vx; f.y += f.vy + sol.vitesse; f.r += 0.25; f.vie--; });
  if (fumees) fumees = fumees.filter(f => f.vie > 0);
  if (etat !== 'jeu') return;

  // déplacement avec un peu d'inertie sur l'inclinaison
  let cible = 0;
  if (touches.ArrowLeft) { avion.x -= avion.vitesse; cible = -1; }
  if (touches.ArrowRight) { avion.x += avion.vitesse; cible = 1; }
  if (touches.ArrowUp) avion.y -= avion.vitesse;
  if (touches.ArrowDown) avion.y += avion.vitesse;
  avion.roulis += (cible - avion.roulis) * 0.12;
  avion.x = Math.max(35, Math.min(W - 35, avion.x));
  avion.y = Math.max(40, Math.min(H - 50, avion.y));

  // tir : deux mitrailleuses d'aile, balles traçantes
  if (delaiTir > 0) delaiTir--;
  if (touches[' '] && delaiTir === 0) {
    const e = 17 * (1 - Math.abs(avion.roulis) * 0.25);
    balles.push({ x: avion.x - e, y: avion.y - 14, flash: 3 }, { x: avion.x + e, y: avion.y - 14, flash: 3 });
    delaiTir = 7;
  }
  balles.forEach(b => { b.y -= 13; b.flash--; });
  balles = balles.filter(b => b.y > -20);

  // ennemis de plus en plus fréquents
  if (--delaiEnnemi <= 0) {
    ennemis.push({ x: alea(40, W - 40), y: -50, v: alea(1.8, 3.2) + score / 600, oscille: alea(0, 1.6), phase: alea(0, 6), vie: 2 });
    delaiEnnemi = Math.max(20, 70 - score / 40);
  }
  ennemis.forEach(e => {
    e.y += e.v;
    e.dx = Math.cos(e.y / 45 + e.phase) * e.oscille;
    e.x += e.dx;
  });

  ennemis.forEach(e => {
    balles.forEach(b => {
      if (!e.mort && !b.mort && touche(e, b, 26)) {
        b.mort = true;
        explosions.push({ x: b.x, y: b.y, vx: 0, vy: 0, vie: 6, max: 6, r: 4 });
        if (--e.vie <= 0) {
          e.mort = true;
          score += 10;
          exploser(e.x, e.y);
        }
      }
    });
  });
  balles = balles.filter(b => !b.mort);

  if (invincible > 0) invincible--;
  ennemis.forEach(e => {
    if (!e.mort && invincible === 0 && touche(e, avion, 36)) {
      e.mort = true;
      exploser(e.x, e.y);
      exploser(avion.x, avion.y, true);
      vies--;
      invincible = 100;
      if (vies <= 0) etat = 'fin';
    }
  });
  ennemis = ennemis.filter(e => !e.mort && e.y < H + 60);

  explosions.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.vie--; });
  explosions = explosions.filter(p => p.vie > 0);
}

function texteCentre(txt, y, taille) {
  ctx.font = `bold ${taille}px Arial`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillText(txt, W / 2 + 2, y + 2);
  ctx.fillStyle = '#fff';
  ctx.fillText(txt, W / 2, y);
}

function dessiner() {
  dessinerSol();

  // fumée au sol
  (fumees || []).forEach(f => {
    ctx.fillStyle = `rgba(60,60,60,${0.35 * f.vie / f.max})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  });

  if (etat !== 'menu') {
    ennemis.forEach(e => dessinerSprite(spriteEnnemi, e.x, e.y, Math.PI, e.dx * 0.4, 30));

    // balles traçantes
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    balles.forEach(b => {
      const g = ctx.createLinearGradient(b.x, b.y - 10, b.x, b.y + 14);
      g.addColorStop(0, 'rgba(255,255,220,1)');
      g.addColorStop(1, 'rgba(255,160,40,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y - 10); ctx.lineTo(b.x, b.y + 14); ctx.stroke();
      if (b.flash > 0) {
        ctx.fillStyle = 'rgba(255,220,120,0.8)';
        ctx.beginPath(); ctx.arc(b.x, avion.y - 14, 4, 0, Math.PI * 2); ctx.fill();
      }
    });
    ctx.restore();

    if (etat === 'jeu' && !(invincible > 0 && Math.floor(invincible / 5) % 2 === 0)) {
      dessinerSprite(spriteJoueur, avion.x, avion.y, 0, avion.roulis, 45);
    }

    // explosions : boule de feu additive
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    explosions.forEach(p => {
      const k = p.vie / p.max;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
      g.addColorStop(0, `rgba(255,240,180,${k})`);
      g.addColorStop(0.4, `rgba(255,140,30,${k * 0.8})`);
      g.addColorStop(1, 'rgba(120,20,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }

  // nuages au-dessus de tout
  nuages.forEach(n => ctx.drawImage(n.img, n.x, n.y, n.img.width * n.e, n.img.height * n.e));

  // crédit des photos
  if (!horsLigne()) {
    ctx.font = '10px Arial';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('Photos © IGN', W - 6, H - 6);
  }

  if (etat === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, W, H);
    texteCentre('PETIT AVION', H / 2 - 60, 44);
    texteCentre('Flèches : se déplacer', H / 2, 20);
    texteCentre('Espace : tirer', H / 2 + 30, 20);
    texteCentre('Appuie sur Entrée pour commencer', H / 2 + 90, 18);
    dessinerSprite(spriteJoueur, W / 2, H / 2 + 190, 0, 0, 45);
    return;
  }

  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillText('Score : ' + score, 14, 32);
  ctx.fillStyle = '#fff';
  ctx.fillText('Score : ' + score, 12, 30);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff5a5a';
  ctx.fillText('♥'.repeat(Math.max(0, vies)), W - 12, 30);

  if (etat === 'fin') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);
    texteCentre('PERDU !', H / 2 - 20, 48);
    texteCentre('Score : ' + score, H / 2 + 25, 24);
    texteCentre('Entrée pour rejouer', H / 2 + 70, 18);
  }
}

function boucle() {
  mettreAJour();
  dessiner();
  requestAnimationFrame(boucle);
}
boucle();
</script>
